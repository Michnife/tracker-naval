<div class="container">

  <!-- TOOLBAR -->
  <div class="namebar">
    <h1>NAVAL TRACKER</h1>
  </div>
  <div class="toolbar">
    <button (click)="toggleFormulaire()">+ AJOUTER</button>
    <button (click)="supprimerSelectionne()" >- SUPPRIMER</button>
  </div>
  <!-- STATS -->
  <div class="stats-panel">

    <h2>UNITES</h2>
    @for (navire of navires(); track navire.id) {
      <div class="stat-item" (click)="selectionner(navire)" style="cursor:pointer">
        <span [class]="'status-' + navire.statut.replace(' ', '-')">{{ navire.nom }}</span>
        <span style="font-size:10px">{{ navire.type }}</span>
      </div>
    }
  </div>

  <!-- CARTE -->
  <div class="map-area">
    <div id="map"></div>

    <!-- FORMULAIRE AJOUT -->
    @if (afficherFormulaire()) {
      <div class="form-overlay">
        <h2 style="font-size:12px; letter-spacing:3px">NOUVELLE UNITE</h2>
        <input [(ngModel)]="nouveauNavire.nom" placeholder="NOM">
        <input [(ngModel)]="nouveauNavire.type" placeholder="TYPE">
        <input [(ngModel)]="nouveauNavire.latitude" placeholder="LATITUDE" type="number">
        <input [(ngModel)]="nouveauNavire.longitude" placeholder="LONGITUDE" type="number">
        <input [(ngModel)]="nouveauNavire.statut" placeholder="STATUT">
        <div style="display:flex; gap:8px;"> <button (click)="ajouter()">CONFIRMER</button>  <button (click)="toggleFormulaire()">SUPPRIMER</button> </div>

      </div>
    }
  </div>

</div>
