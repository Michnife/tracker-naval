version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: fleettracker-db
    environment:
      POSTGRES_DB: fleettracker
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"

  backend:
    build: ./tracker
    container_name: fleettracker-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleettracker
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      - postgres

  frontend:
    build: ./fleet-tracker-frontend
    container_name: fleettracker-frontend
    ports:
      - "80:80"
    depends_on:
      - backend